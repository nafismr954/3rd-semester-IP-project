<html>
    <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact me</title>
        <style>
            body{
                background-color: blanchedalmond;
                color: black;
            }
        </style>
    </head>
    <body>
        <h3><p align="center" font color="blue">Please complete the form & leave your message</p></h3><br><br>
        <form action="index.html" target="_blank" autocomplete="on" method="post">
            <label>First Name:</label>
            <input type="text" placeholder="Enter your first name" name="firstname"/><br><br>
            <label>Last Name:</label>
            <input type="text" placeholder="Enter your last name" name="lastname"/><br><br>
            <label>Email</label>
            <input type="text" placeholder="Enter your email" name="email"/><br><br>
            <label>Gender</label>
            <input type="radio" name="gender" value="male"/><b>male</b> 
            <input type="radio" name="gender" value="female"/><b>female</b>
            <input type="radio" name="gender" value="other"/><b>other</b><br><br>
            <label>City:</label>
            <select name="City">
                <option value="Dhaka">Dhaka</option>
                <option value="chattogram">chattogram</option>
                <option value="Comilla">Comilla</option>
                <option value="Rajshahi">Rajshahi</option>
                <option value="Khulna">Khulna</option>
                <option value="Pabna">Pabna</option>
            </select>
            <br><br>
            <label>Agreement</label>
            <input type="checkbox" name="agree"/>
            I agree
            <br><br>
            <!-- <lablel>Massage:</lablel> -->
<textarea name="Massage" placeholder="enter your massage"></textarea><br><br>
<button type="submit">submit</button>
        </form>
    </body>
</html>
