<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css-box</title>
    <style>
        * {
            box-sizing: border-box;
        }
        .box {
            width: 300px;
            padding: 20px 15px;
            border: 2px solid black;
            margin: 30px;
            background:blanchedalmond;
        }
    </style>
</head>
<body>
<div class="box" align="center">Hello Nafis</div>
</body>
</html>
